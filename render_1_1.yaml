services:
  - type: web
    name: xiaozhi-mcp-vn
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bridge.py
    envVars:
      - key: MCP_ENDPOINT
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
